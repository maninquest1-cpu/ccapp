<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign-in complete</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}
textarea{width:100%;height:120px;font-family:monospace;font-size:13px}button{font-size:16px;padding:8px 18px;margin-top:8px}</style></head><body>
<h1>Sign-in complete</h1>
<p id="msg">Copy the text below and paste it into the uploader on your computer. Then close this page.</p>
<textarea id="out" readonly></textarea><br>
<button onclick="navigator.clipboard.writeText(document.getElementById('out').value);this.textContent='Copied'">Copy</button>
<p style="color:#666;font-size:14px">This page only shows the one-time code from the address bar. It sends nothing anywhere.</p>
<script>
var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
var code = q.get('code') || h.get('code'), err = q.get('error') || h.get('error');
document.getElementById('out').value = err ? ('ERROR: ' + err + ' ' + (q.get('error_description') || '')) : (location.href);
if (!code && !err) document.getElementById('msg').textContent = 'No code in the address. Start the sign-in again from the uploader.';
</script>
<p><a href="./">ContentChannels Uploader</a></p>
</body></html>
